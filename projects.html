  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Home">
        <span>NOMIN BATJARGAL</span>
        <span class="wip-badge">Work in Progress</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a class="active" href="projects.html">Projects</a>
        <a href="resume.html">Resume</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.6"></circle>
            <path d="M12 1.8v2.4M12 19.8v2.4M4.93 4.93l1.7 1.7M17.37 17.37l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.93 19.07l1.7-1.7M17.37 6.63l1.7-1.7"></path>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 14.2A8.5 8.5 0 0 1 9.8 3.2a8.5 8.5 0 1 0 11 11Z"></path>
          </svg>
        </button>
      </nav>
    </header>

    <main>
      <section class="section project-intro">
        <div class="section-inner">
          <div class="section-heading project-page-heading">
            <h2>Projects</h2>
            <p>
              Click any project to see more details, including links to the code and live site where available.
            </p>
            <!-- Filter buttons will be injected here automatically -->
            <div class="project-filter-bar" id="filter-bar"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <!-- Target container for dynamically rendered projects -->
        <div class="section-inner project-list" data-projects-container></div>
      </section>

      <div class="project-modal" id="project-modal" hidden>
        <div class="project-modal-backdrop" data-modal-close></div>
        <article class="project-modal-card" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
          <div class="project-modal-titlebar">
            <p class="project-modal-type" id="project-modal-type"></p>
            <button class="project-modal-close" type="button" data-modal-close aria-label="Close project details">&times;</button>
          </div>
          <div class="project-modal-body">
            <h2 id="project-modal-title"></h2>
            <div class="project-modal-visual" id="project-modal-visual"></div>
            <p class="project-modal-summary" id="project-modal-summary"></p>
            <div class="project-modal-details" id="project-modal-details"></div>
            <div class="project-modal-meta" id="project-modal-meta"></div>
          </div>
        </article>
      </div>
    </main>

    <footer class="site-footer">

      </div>

  <script src="script.js"></script>
